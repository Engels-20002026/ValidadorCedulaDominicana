
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cédula Dominicana</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <div class="icon">🇩🇴</div>

            <h1>Validador de Cédula</h1>
            <p class="subtitle">
                República Dominicana
            </p>

            <form id="cedulaForm">
                <label for="cedula">
                    Introduce tu número de cédula
                </label>

                <input
                    type="text"
                    id="cedula"
                    placeholder="000-0000000-0"
                    maxlength="13"
                    autocomplete="off"
                >

                <button type="submit">
                    Validar cédula
                </button>
            </form>

            <div id="resultado" class="resultado"></div>

            <p class="info">
                Sistema de validación mediante el algoritmo módulo 10.
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
